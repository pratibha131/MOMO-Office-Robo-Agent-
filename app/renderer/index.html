<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Momo</title>
<link rel="stylesheet" href="momo.css">
</head>
<body>
  <div id="bubble" class="hidden"><span id="bubble-text"></span></div>

  <div id="stage">
    <div id="pulse-ring"></div>
    <img id="robot" src="momo.png" alt="Momo" draggable="false">
    <div id="rec-badge"><span></span>REC</div>
  </div>

  <div id="typebox" class="hidden">
    <input id="typeinput" type="text" placeholder="Type a command for Momo…" />
  </div>

  <div id="controls">
    <button id="btn-notes" title="Meeting notes (auto-detects Teams calls too)">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm-7 14H7v-2h5Zm5-4H7v-2h10Zm0-4H7V7h10Z"/></svg>
    </button>
    <button id="btn-mic" title="Talk to Momo">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12Z"/></svg>
    </button>
    <button id="btn-kb" title="Type instead">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2ZM6 9h2v2H6Zm0 4h2v2H6Zm4-4h2v2h-2Zm0 4h2v2h-2Zm4-4h2v2h-2Zm0 4h2v2h-2Zm-6 4h8v1H8Zm10-8h-2V9h2Zm0 6h-2v-2h2Z"/></svg>
    </button>
    <button id="btn-close" title="Close Momo">
      <svg viewBox="0 0 24 24" width="12" height="12"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7 4.3 4.3l6.3 6.3 6.3-6.3z"/></svg>
    </button>
  </div>

<script src="momo.js"></script>
</body>
</html>
